<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header ref="{{ hdrRef }}" style="position:sticky;top:0;z-index:30;background:rgba(243,246,247,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #e2e8eb;font-family:'Geist',system-ui,sans-serif">
  <div style="max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;column-gap:14px;row-gap:8px;padding:12px 24px">
    <a href="Wedy Portal.dc.html" style="display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0"><img src="assets/wedy-avatar.png" alt="Wedy" style="width:32px;height:32px;border-radius:50%;object-fit:cover;background:#0f262e;border:1.5px solid #ffffff;box-shadow:0 0 0 1px #e2e8eb"><span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.03em;color:#0a1c24">Wedy</span><span style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#e4f2f4;color:#0b5f72;white-space:nowrap">Espace collaborateur</span></a>
    <nav style="order:{{ navOrder }};flex:{{ navFlex }};min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:2px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5"><a href="{{ t.href }}" style="position:relative;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:11px;background:{{ t.bg }};color:{{ t.color }};font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap;flex-shrink:0" style-hover="color:#0a1c24;background:#ffffff"><span data-icon="{{ t.icon }}" data-size="15" style="display:inline-flex;width:15px;height:15px"></span>{{ t.label }}</a></sc-for>
    </nav>
    <a href="Wedy Copilot.dc.html" aria-label="Demander à Wedy" style="margin-left:auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;min-width:38px;padding:0 {{ askPad }};border-radius:11px;background:#0a1c24;color:#ffffff;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;flex-shrink:0" style-hover="color:#ffffff;background:#16323c"><span data-icon="sparkles" data-size="14" style="display:inline-flex;width:14px;height:14px;color:#5fe3f0"></span><sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><span>Demander à Wedy</span></sc-if></a>
    <span style="position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0e6f84,#16b6c8);color:#ffffff;font-size:13px;font-weight:700;flex-shrink:0">YB<span style="position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#16a06b;border:2px solid #f3f6f7"></span></span>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;leave&quot;,&quot;docs&quot;,&quot;training&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TABS = [['home', 'Accueil', 'house|home', 'Wedy Portal.dc.html'], ['leave', 'Mes congés', 'calendar', 'Wedy Portal Leave.dc.html'], ['docs', 'Mes documents', 'file-text', 'Wedy Portal Documents.dc.html'], ['training', 'Formation', 'graduation-cap', 'Wedy Portal Training.dc.html'], ['profile', 'Mon profil', 'user', 'Wedy Portal Profile.dc.html']];
class Component extends DCLogic {
  state = { compact: false };
  hdrRef = React.createRef();
  componentDidMount() {
    const el = this.hdrRef.current; if (!el) return;
    const f = () => { const c = el.clientWidth < 1100; if (c !== this.state.compact) this.setState({ compact: c }); };
    this._ro = new ResizeObserver(f); this._ro.observe(el); f();
  }
  componentWillUnmount() { if (this._ro) this._ro.disconnect(); }
  renderVals() {
    const a = this.props.active ?? 'home', c = this.state.compact;
    return {
      hdrRef: this.hdrRef, wide: !c, askPad: c ? '0' : '13px',
      navOrder: c ? '5' : '0', navFlex: c ? '1 1 100%' : '1 1 0%',
      tabs: TABS.map(([k, label, icon, href]) => ({ label, icon, href, bg: k === a ? '#ffffff' : 'transparent', color: k === a ? '#0b5f72' : '#52646d' })),
    };
  }
}
</script>
</body>
</html>
