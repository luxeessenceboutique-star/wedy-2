version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: rh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rh_password}
      POSTGRES_DB: ${POSTGRES_DB:-rh_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_user}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rh_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rh_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  # TURN relay for Wedy Visio (calls between people on different networks). Optional, not started by default:
  #   docker compose --profile turn up -d coturn
  # Needs VISIO_TURN_SECRET and VISIO_TURN_EXTERNAL_IP (the server's public IP) in the environment, and these ports open in the
  # firewall: UDP + TCP 3478 and UDP 49160-49200. Host networking: a relay needs a wide UDP range. Then point the backend at it:
  #   VISIO_TURN_URL=turn:<public host>:3478?transport=udp,turn:<public host>:3478?transport=tcp  and the same VISIO_TURN_SECRET.
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6.2
    container_name: wedy_coturn
    network_mode: host
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--realm=${VISIO_TURN_REALM:-wedy}"
      - "--use-auth-secret"
      - "--static-auth-secret=${VISIO_TURN_SECRET:-}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--external-ip=${VISIO_TURN_EXTERNAL_IP:-}"
      - "--fingerprint"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
      # never relay towards private / internal addresses (a TURN server must not be a door into the internal network)
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=198.18.0.0-198.19.255.255"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh_celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: celery -A app.worker.celery_app worker --loglevel=info -c 4
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh_flower
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: celery -A app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: rh_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
